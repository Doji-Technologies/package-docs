# Copy to .github/workflows/update-package-docs.yml in a package repository.
#
# Rebuilds and republishes https://docs.doji-tech.com when package.json changes
# on the default branch (usually a version bump). To publish documentation
# changes without a version bump, run this workflow manually.
#
# Needs the secret PACKAGE_DOCS_TOKEN: a fine-grained personal access token for
# Doji-Technologies/package-docs with the permission "Contents: Read and write".
# The repository must also be listed in packages.txt of package-docs.

name: Update package docs

on:
  push:
    branches: [master, main]
    paths: ['**/package.json']
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
    - name: Trigger the package-docs build
      env:
        PACKAGE_DOCS_TOKEN: ${{ secrets.PACKAGE_DOCS_TOKEN }}
      run: |
        curl --fail-with-body -sS -X POST \
          -H "Authorization: Bearer $PACKAGE_DOCS_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/Doji-Technologies/package-docs/dispatches \
          -d '{"event_type":"package-updated","client_payload":{"repository":"${{ github.repository }}"}}'
