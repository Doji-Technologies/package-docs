# Build and publish multiple docfx projects to GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.build.outputs.failed }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    # Lets scripts/build-docs.sh clone the private package repositories.
    - name: Authenticate git for the package repositories
      env:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        if [ -n "$PAT_TOKEN" ]; then
          git config --global url."https://x-access-token:${PAT_TOKEN}@github.com/".insteadOf "https://github.com/"
        fi

    - name: Dotnet Setup
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x

    # 2.78.0 is the first version with the AllowUnsafeBlocks metadata property.
    - name: Install docfx
      run: dotnet tool install -g docfx --version 2.81.0

    # Unity reference assemblies, package tarballs, compiled dependencies, xref maps.
    - name: Restore Unity references
      id: refs
      uses: actions/cache/restore@v4
      with:
        path: .unity-refs
        key: unity-refs-v1-${{ github.run_id }}
        restore-keys: unity-refs-v1-

    - name: Build documentation for each package
      id: build
      run: bash scripts/build-docs.sh

    - name: Hash Unity references
      id: refs-hash
      run: |
        mkdir -p .unity-refs
        rm -rf .unity-refs/obj
        echo "hash=$(find .unity-refs -type f | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Save Unity references
      if: github.event_name != 'pull_request' && steps.refs.outputs.cache-matched-key != format('unity-refs-v1-{0}', steps.refs-hash.outputs.hash)
      uses: actions/cache/save@v4
      with:
        path: .unity-refs
        key: unity-refs-v1-${{ steps.refs-hash.outputs.hash }}

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'build'  # Upload the aggregated documentation

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # The packages that built are published either way; this makes the failure visible.
  report:
    needs: [build, deploy]
    if: always() && needs.build.outputs.failed != ''
    runs-on: ubuntu-latest
    steps:
    - name: Fail on packages that did not build
      run: |
        echo "::error::Documentation build failed for: ${{ needs.build.outputs.failed }}"
        exit 1
