# Build the docfx documentation of the packages in packages.txt and publish it
# to the gh-pages branch, which GitHub Pages serves.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  # Poll the package repositories: a package is rebuilt when the version in its
  # package.json differs from the published one.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

# One publish at a time. Pull requests publish nothing and have their own group.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push to gh-pages
    env:
      SITE_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    # Lets scripts/plan.sh clone the private package repositories.
    - name: Authenticate git for the package repositories
      env:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        if [ -n "$PAT_TOKEN" ]; then
          git config --global url."https://x-access-token:${PAT_TOKEN}@github.com/".insteadOf "https://github.com/"
        fi

    - name: Fetch the published site
      run: git clone --quiet --depth 1 --branch gh-pages "$SITE_REMOTE" site || mkdir -p site

    # A scheduled run builds only the packages with a new version. Every other
    # run (push, pull request, manual) builds all of them.
    - name: Find the packages to build
      id: plan
      env:
        FORCE: ${{ github.event_name != 'schedule' && '1' || '' }}
      run: bash scripts/plan.sh site

    - name: Dotnet Setup
      if: steps.plan.outputs.count != '0'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x

    # 2.78.0 is the first version with the AllowUnsafeBlocks metadata property.
    - name: Install docfx
      if: steps.plan.outputs.count != '0'
      run: dotnet tool install -g docfx --version 2.81.0

    # Unity reference assemblies, package tarballs, compiled dependencies, xref maps.
    - name: Restore Unity references
      if: steps.plan.outputs.count != '0'
      id: refs
      uses: actions/cache/restore@v4
      with:
        path: .unity-refs
        key: unity-refs-v1-${{ github.run_id }}
        restore-keys: unity-refs-v1-

    - name: Build documentation
      if: steps.plan.outputs.count != '0'
      id: build
      run: bash scripts/build-docs.sh

    - name: Hash Unity references
      if: steps.plan.outputs.count != '0'
      id: refs-hash
      run: |
        mkdir -p .unity-refs
        rm -rf .unity-refs/obj
        echo "hash=$(find .unity-refs -type f | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Save Unity references
      if: steps.plan.outputs.count != '0' && github.event_name != 'pull_request' && steps.refs.outputs.cache-matched-key != format('unity-refs-v1-{0}', steps.refs-hash.outputs.hash)
      uses: actions/cache/save@v4
      with:
        path: .unity-refs
        key: unity-refs-v1-${{ steps.refs-hash.outputs.hash }}

    - name: Upload the built documentation
      if: github.event_name == 'pull_request' && steps.plan.outputs.count != '0' && steps.build.outputs.built != '0'
      uses: actions/upload-artifact@v4
      with:
        name: docs
        path: build
        retention-days: 7

    # Only the folders of the packages that were built are replaced. The branch
    # is rewritten as a single commit so that it does not grow with every build.
    - name: Publish to gh-pages
      if: github.event_name != 'pull_request' && steps.plan.outputs.count != '0' && steps.build.outputs.built != '0'
      run: |
        bash scripts/publish.sh site
        cd site
        rm -rf .git
        git init --quiet --initial-branch gh-pages
        git add --all
        git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
          commit --quiet -m "Publish documentation (${GITHUB_SHA::7}, run ${GITHUB_RUN_ID})"
        git push --quiet --force "$SITE_REMOTE" gh-pages

    # The other packages are published either way; this makes the failure visible.
    - name: Fail on packages that did not build
      if: steps.plan.outputs.failed != '' || steps.build.outputs.failed != ''
      run: |
        echo "::error::Documentation build failed for: ${{ steps.plan.outputs.failed }} ${{ steps.build.outputs.failed }}"
        exit 1
